name: Build myoasm Images

on:
  push:
    branches:
      - "main"
      - "dev"
    paths:
      - ".github/workflows/build-myoasm-images.yml"
      - "console/**"
      - "core-api/**"
      - "grpc-client/go/**"
      - "worker/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build manually"
        type: choice
        default: all
        options:
          - all
          - console
          - core-api
          - worker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            console:
              - 'console/**'
              - '.github/workflows/build-myoasm-images.yml'
            api:
              - 'core-api/**'
              - '.github/workflows/build-myoasm-images.yml'
            worker:
              - 'worker/**'
              - 'grpc-client/go/**'
              - '.github/workflows/build-myoasm-images.yml'
      - id: set-matrix
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          SVC: ${{ github.event.inputs.service }}
        run: |
          add_console=false; add_api=false; add_worker=false

          if [ "$DISPATCH" == "true" ]; then
            case "$SVC" in
              all)      add_console=true; add_api=true; add_worker=true ;;
              console)  add_console=true ;;
              core-api) add_api=true ;;
              worker)   add_worker=true ;;
            esac
          else
            [ "${{ steps.filter.outputs.console }}" == "true" ] && add_console=true
            [ "${{ steps.filter.outputs.api }}" == "true" ] && add_api=true
            [ "${{ steps.filter.outputs.worker }}" == "true" ] && add_worker=true
          fi

          CHANGED=()
          $add_console && CHANGED+=( '{"service":"console","image":"sil3ntcor3/myoasm-console","context":"console","dockerfile":"console/Dockerfile"}' )
          $add_api && CHANGED+=( '{"service":"core-api","image":"sil3ntcor3/myoasm-api","context":"core-api","dockerfile":"core-api/Dockerfile"}' )
          $add_worker && CHANGED+=( '{"service":"worker","image":"sil3ntcor3/myoasm-worker","context":".","dockerfile":"worker/Dockerfile"}' )

          if [ ${#CHANGED[@]} -eq 0 ]; then
            MATRIX='{"include":[]}'
          else
            MATRIX="{\"include\":[$(IFS=,; echo "${CHANGED[*]}")]}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    name: Build & Push (${{ matrix.service }})
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.matrix != '{"include":[]}' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        run: |
          case "$GITHUB_REF_NAME" in
            main) image_channel="latest" ;;
            dev) image_channel="dev" ;;
            *)
              echo "Unsupported image branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          # The console image uses Bun during build; ARM64 emulation on GitHub Actions
          # is unstable here and causes the qemu Illegal instruction failure seen in CI.
          docker buildx build \
            --platform linux/amd64 \
            -t "${{ matrix.image }}:${image_channel}" \
            -t "${{ matrix.image }}:sha-${GITHUB_SHA::12}" \
            --push \
            --file "${{ matrix.dockerfile }}" \
            "${{ matrix.context }}"
