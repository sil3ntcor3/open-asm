services:
  credential-check:
    image: alpine:3.22.1
    network_mode: none
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a generated secret of at least 32 characters}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD to a generated URI-safe secret of at least 32 characters}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY to a unique access key of at least 16 characters}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY to a generated secret of at least 32 characters}
    volumes:
      - ./scripts/validate-compose-secrets.sh:/usr/local/bin/validate-compose-secrets.sh:ro
    command: ['/bin/sh', '/usr/local/bin/validate-compose-secrets.sh']
    restart: 'no'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  console:
    container_name: console
    image: oasm/oasm-console:latest
    build:
      context: ./console
      dockerfile: Dockerfile
    networks:
      - oasm
    env_file:
      - ./console/.env
    ports:
      - '3000:80'
    restart: 'always'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

    depends_on:
      core-api:
        condition: service_healthy

  core-api:
    container_name: oasm-api
    image: oasm/oasm-api:latest
    build:
      context: ./core-api
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-development}
        APP_CHANNEL: ${APP_CHANNEL:-development}
        APP_COMMIT: ${APP_COMMIT:-local}
    networks:
      - oasm
    env_file:
      - ./core-api/.env
    ports:
      - '6276:6276'
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a generated secret of at least 32 characters}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD to a generated URI-safe secret of at least 32 characters}@redis:6379/0
      - GEO_IP_URL=geo-ip:4360
      - OASM_CLOUD_APIKEY=${WORKER_ENROLLMENT_TOKEN:?Set WORKER_ENROLLMENT_TOKEN to a secret of at least 32 characters}
      - GRPC_BIND_HOST=0.0.0.0
      - GRPC_REFLECTION_ENABLED=false
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CA_FILE=${GRPC_TLS_CA_FILE:-}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
      - RUSTFS_ENDPOINT=http://rustfs:9000
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY to a unique access key of at least 16 characters}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY to a generated secret of at least 32 characters}
    restart: 'always'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ./.open-api:/.open-api
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6276/api/health']
      interval: 1s
      timeout: 30s
      retries: 10

  oasm-worker:
    image: oasm/oasm-worker:latest
    build:
      # Repo root context: the worker's go.mod has a local `replace` for
      # ../grpc-client/go, so the build needs both directories.
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - ./worker/.env
    environment:
      - WORKER_API_KEY=${WORKER_ENROLLMENT_TOKEN:?Set WORKER_ENROLLMENT_TOKEN to a secret of at least 32 characters}
      - WORKER_GRPC_HOST=core-api
      - WORKER_GRPC_PORT=16276
      - WORKER_GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - WORKER_GRPC_TLS_CA_FILE=${WORKER_GRPC_TLS_CA_FILE:-}
      - WORKER_GRPC_TLS_CERT_FILE=${WORKER_GRPC_TLS_CERT_FILE:-}
      - WORKER_GRPC_TLS_KEY_FILE=${WORKER_GRPC_TLS_KEY_FILE:-}
      - WORKER_GRPC_TLS_SERVER_NAME=${WORKER_GRPC_TLS_SERVER_NAME:-core-api}
      - WORKER_MAX_CONCURRENCY=10
      - WORKER_TOOL_PATH=/app/oasm-tools
      - WORKER_JOB_TIMEOUT=30m
      - WORKER_JOB_STDOUT_LIMIT_BYTES=16777216
      - WORKER_JOB_STDERR_LIMIT_BYTES=16777216
      - WORKER_NUCLEI_TEMPLATE_REFRESH_INTERVAL=${WORKER_NUCLEI_TEMPLATE_REFRESH_INTERVAL:-6h}
      - WORKER_NUCLEI_TEMPLATE_MAX_STALE=${WORKER_NUCLEI_TEMPLATE_MAX_STALE:-24h}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - worker-tools-cache:/app/oasm-tools:rw
    networks:
      - oasm
    restart: 'always'
    depends_on:
      core-api:
        condition: service_healthy

  postgres:
    container_name: oasm-postgres
    image: pgvector/pgvector:pg17
    restart: always
    env_file:
      - ./core-api/.env
    environment:
      POSTGRES_USER: '${POSTGRES_USERNAME:-postgres}'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a generated secret of at least 32 characters}
      POSTGRES_DB: ${POSTGRES_DB:-open_asm}
      PGUSER: '${POSTGRES_USERNAME:-postgres}'
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a generated secret of at least 32 characters}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
    networks:
      - oasm
    depends_on:
      credential-check:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-open_asm}"']
      interval: 1s
      timeout: 5s
      retries: 10

  redis:
    container_name: oasm-redis
    image: redis:alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD to a generated URI-safe secret of at least 32 characters}
    networks:
      - oasm
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - redis-data:/data
    command: ['/bin/sh', '-ec', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      credential-check:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1500M
        reservations:
          cpus: '0.5'
          memory: 512M

  geo-ip:
    container_name: geo-ip
    image: ghcr.io/l1ttps/geoip-proxy:latest
    networks:
      - oasm
    ports:
      - '4360:4360'
    restart: 'always'
    volumes:
      - geoip-data:/app/data:rw

  rustfs:
    container_name: oasm-rustfs
    image: rustfs/rustfs:latest
    networks:
      - oasm
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY to a unique access key of at least 16 characters}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY to a generated secret of at least 32 characters}
    volumes:
      - rustfs-data:/data:rw
    restart: 'always'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: ['/data']
    depends_on:
      credential-check:
        condition: service_completed_successfully

  migration:
    container_name: oasm-migration
    image: oasm/oasm-api:latest
    networks:
      - oasm
    env_file:
      - ./core-api/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a generated secret of at least 32 characters}
      - POSTGRES_DB=${POSTGRES_DB:-open_asm}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD to a generated URI-safe secret of at least 32 characters}@redis:6379/0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "node node_modules/typeorm/cli.js migration:run -d dist/database/database-config.js"

volumes:
  pgdata:
  redis-data:
  redpanda-data:
  geoip-data:
  rustfs-data:
  worker-tools-cache:

networks:
  oasm:
    driver: bridge
